  $('s-mode').innerHTML='<h2>Type de partie</h2><div>'+seg('mode',[['flight','Par flight'],['teams','En équipes']],S.mode)+'</div><p class="sub" style="margin:0">'+(S.mode==='flight'?'Un seul formulaire pour un flight de 1 à 4 joueurs qui jouent ensemble. En Stableford ou au Wolf, chaque joueur marque pour lui. Pour les formules d’équipe (scramble, greensome, best & worst…), le flight forme une seule équipe.':'Plusieurs équipes de 1 à 8 joueurs, comparées entre elles au classement.')+'</p>';

function seg(id,opts,val){return'<div class="seg" role="group">'+opts.map(o=>'<button data-act="'+id+'" data-v="'+o[0]+'" aria-pressed="'+(o[0]===val)+'">'+o[1]+'</button>').join('')+'</div>';}

  const C=CRS[S.course];

function teeOk(c,loop,k,sx){const L=T[c]&&T[c][loop];return!!(L&&L[k]&&L[k][sx]);}
function teeOpts(cur,sx){const ks=teeKeys(S.course).slice();if(cur&&!ks.includes(cur))ks.push(cur);
  return ks.map(k=>{const ok=teeOk(S.course,S.loop,k,sx);
  return'<option value="'+k+'"'+(cur===k?' selected':'')+'>'+esc(TEES[k]||k)+(teeKeys(S.course).includes(k)?(ok?'':' (pas de table '+(sx==='F'?'Dames':'Hommes')+')'):' (autre parcours)')+'</option>';}).join('');}
function fitTee(p){if(teeOk(S.course,S.loop,p.tee,p.sex))return false;const ks=teeKeys(S.course).filter(k=>teeOk(S.course,S.loop,k,p.sex));if(!ks.length)return false;
  const pref=p.sex==='F'?['B','R','LBT','D','Y','LFT']:['Y','W','MFT','H','B','MBT'];const k=pref.find(x=>ks.includes(x))||ks[Math.min(1,ks.length-1)];p.tee=k;return true;}
function fitTees(){let n=0;[S.flight,...S.teams].forEach(t=>t&&t.players.forEach(p=>{if(fitTee(p))n++;}));return n;}
const RECENT_KEY='tournette-recent-courses';
function recentCourses(){try{return(JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')||[]).filter(c=>CRS[c]);}catch(e){return[];}}
function pushRecent(c){try{const r=[c,...recentCourses().filter(x=>x!==c)].slice(0,4);localStorage.setItem(RECENT_KEY,JSON.stringify(r));}catch(e){}}
const normS=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function courseItems(){
  const it=[],rec=recentCourses().filter(c=>c!=='en'&&c!=='us');
  ['en','us'].forEach(c=>it.push({id:c,g:'Mon club : Château de la Tournette',l:CRS[c].n,k:normS('tournette chateau '+CRS[c].n)}));
  rec.forEach(c=>it.push({id:c,g:'Récents',l:CRS[c].n+(CRS[c].ville?' · '+CRS[c].ville:''),k:normS(CRS[c].n+' '+(CRS[c].ville||'')+' '+(CRS[c].prov||''))}));
  const provs={};EXT.forEach(c=>(provs[c.prov]=provs[c.prov]||[]).push(c));
  Object.keys(provs).sort((a,b)=>a.localeCompare(b,'fr')).forEach(p=>provs[p].forEach(c=>it.push({id:c.id,g:p,l:c.n+' · '+c.ville,k:normS(c.n+' '+c.ville+' '+p)})));
  return it;
}
function courseSelect(){
  return'<div class="cb" id="cb"><input id="cb-in" type="search" role="combobox" aria-expanded="false" aria-controls="cb-list" aria-label="Choisir le parcours (taper pour rechercher)" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Rechercher un parcours…" value="'+esc(CRS[S.course].n)+'"><div class="cb-list" id="cb-list" role="listbox" hidden></div></div>';
}
function chooseCourse(id){
  if(!CRS[id])return;S.course=id;if(!hasLoops(S.course))S.loop='18';pushRecent(S.course);const n=fitTees();rCourse();rPlayers();rRoster();rDerived();
  if(n)toast(n+' départ'+(n>1?'s':'')+' ajusté'+(n>1?'s':'')+' : ce parcours n’a pas les mêmes départs.');
}
let CB_ACT=-1;
function cbRender(q){
  const list=$('cb-list');if(!list)return;
  const toks=normS(q).split(/\s+/).filter(Boolean),all=courseItems(),sh=all.filter(x=>toks.every(t=>x.k.includes(t)));
  let h='',g='';
  sh.forEach((x,i)=>{if(x.g!==g){g=x.g;h+='<div class="cb-g" role="presentation">'+esc(g)+'</div>';}h+='<button type="button" class="cb-i" role="option" data-cid="'+esc(x.id)+'" aria-selected="'+(x.id===S.course)+'">'+esc(x.l)+'</button>';});
  list.innerHTML=h||'<div class="cb-g">Aucun parcours trouvé</div>';list.hidden=false;CB_ACT=-1;
  const inp=$('cb-in');if(inp)inp.setAttribute('aria-expanded','true');
}
function cbClose(){const l=$('cb-list'),i=$('cb-in');if(l)l.hidden=true;if(i){i.setAttribute('aria-expanded','false');i.value=CRS[S.course].n;}}
function cbMove(d){const its=[...document.querySelectorAll('#cb-list .cb-i')];if(!its.length)return;its.forEach(x=>x.classList.remove('act'));CB_ACT=(CB_ACT+d+its.length)%its.length;its[CB_ACT].classList.add('act');its[CB_ACT].scrollIntoView({block:'nearest'});}
document.addEventListener('mouseup',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.s&&t.tagName==='INPUT'&&!t.readOnly&&!t.disabled){try{t.select();}catch(x){}}});
document.addEventListener('focusin',e=>{if(e.target.id==='cb-in'){e.target.select();cbRender('');}else if(e.target.dataset&&e.target.dataset.s&&e.target.tagName==='INPUT'){const t=e.target;try{t.select();}catch(x){}setTimeout(()=>{try{t.select();}catch(x){}},0);}});
document.addEventListener('input',e=>{if(e.target.id==='cb-in')cbRender(e.target.value);});
document.addEventListener('keydown',e=>{
  if(e.target.id!=='cb-in')return;
  if(e.key==='ArrowDown'){e.preventDefault();if($('cb-list').hidden)cbRender(e.target.value);else cbMove(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();cbMove(-1);}
  else if(e.key==='Enter'){e.preventDefault();const it=document.querySelector('#cb-list .cb-i.act')||document.querySelector('#cb-list .cb-i');if(it)chooseCourse(it.dataset.cid);}
  else if(e.key==='Escape'){cbClose();e.target.blur();}
});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.cb-list'))e.preventDefault();});

document.addEventListener('focusout',e=>{if(e.target.id==='cb-in')setTimeout(()=>{if(document.activeElement!==$('cb-in'))cbClose();},200);});

      });

      const gr=info.rows.map((r,i)=>{const eff=hs.map((x,j)=>{const g=parseScore(scoreOf(t.id,r.p.id,x));return typeof g==='number'?g:(g==='x'?parOf(x)+str[i][j]+2:null);});LASTEFF[t.id+':'+r.p.id]=eff;const v=eff.filter(e=>e!=null);return{net:sum(eff.map((e,j)=>e==null?0:e-str[i][j])),tot:sum(v),n:v.length,par:sum(hs.filter((x,j)=>eff[j]!=null).map(x=>parOf(x)))};});
      info.rows.forEach((r,i)=>{setT('tp-'+t.id+'-'+r.p.id,pt[i]);{const ge=$('g-'+t.id+'-'+r.p.id);if(ge)ge.innerHTML=gr[i].n?'<b>'+gr[i].tot+'</b> <small style="color:var(--muted)">('+(gr[i].tot-gr[i].par>0?'+':'')+(gr[i].tot-gr[i].par)+')</small>':'';}
        hs.forEach((x,j)=>{const inp=document.querySelector('[data-s="'+t.id+':'+r.p.id+':'+x+'"]');if(!inp)return;const td=inp.parentElement;let sp=td.querySelector('.ef');if(parseScore(scoreOf(t.id,r.p.id,x))==='x'){if(!sp){sp=document.createElement('span');sp.className='ef';td.appendChild(sp);}sp.textContent=LASTEFF[t.id+':'+r.p.id][j];sp.title='Balle ramassée : brut compté = par + coups reçus + 2';}else if(sp)sp.remove();});});
      setT('tp-'+t.id+'-E',teamTot);
      const gTot=sum(gr.map(q=>q.tot)),gN=sum(gr.map(q=>q.n)),gPart=gr.some(q=>q.n<hs.length);

      const gPar=sum(gr.map(q=>q.par));
      info.rows.forEach((r,i)=>{if(gr[i].n)GRL.push({n:r.p.name,team:S.mode==='teams'?t.name:'',tot:gr[i].tot,d:gr[i].tot-gr[i].par,net:gr[i].net,dn:gr[i].net-gr[i].par,part:gr[i].n<hs.length});});
      if(S.mode==='teams'&&gN){const nT=sum(gr.map(q=>q.net));GRT.push({n:t.name,team:'',tot:gTot,d:gTot-gPar,net:nT,dn:nT-gPar,part:gPart});}
      if(S.mode==='teams')info.rows.forEach((r,i)=>IND.push({n:r.p.name,team:t.name,pts:pt[i],extra:gr[i].n?brutTxt(gr[i].tot,gr[i].n<hs.length,gr[i].par):'',d:gr[i].n?gr[i].tot-gr[i].par:999}));
      $('sum-'+t.id).textContent='Total '+(S.mode==='flight'?'du flight':'équipe')+' : '+teamTot+' points'+(S.format==='stableford'&&gN?' · '+brutTxt(gTot,gPart,gPar):'');
      if(S.mode==='flight'&&S.format==='stableford')info.rows.forEach((r,i)=>rank.push({n:r.p.name,pts:pt[i],extra:gr[i].n?brutTxt(gr[i].tot,gr[i].n<hs.length,gr[i].par):''}));else rank.push({n:t.name,pts:teamTot,extra:S.format==='stableford'&&gN?brutTxt(gTot,gPart,gPar):''});
    }else if(f.k==='team'){
      const a=holeArr(info.teamPH);let tot=0,gs=0,np=0;
      hs.forEach((x,j)=>{const g=parseScore(scoreOf(t.id,'T',x)),p=stabPts(g,parOf(x),a[j]);setT('pp-'+t.id+'-T-'+x,p);if(p!=null)tot+=p;if(typeof g==='number'){gs+=g;np++;}});
      setT('tp-'+t.id+'-T',tot);setT('g-'+t.id,np?gs:'');
      const net=np===hs.length?' · brut '+gs+' − '+info.teamPH+' = net '+(gs-info.teamPH):(np?' · brut '+gs+' ('+np+' trous)':'');
      $('sum-'+t.id).textContent='Total équipe : '+tot+' points'+net;
      rank.push({n:t.name,pts:tot,extra:np===hs.length?'net '+(gs-info.teamPH):''});
    }else{
      const n=info.rows.length,pt=info.rows.map(()=>0),ws=cfg;
      const str=info.rows.map(r=>holeArr(r.ph));
      hs.forEach((x,j)=>{
        info.rows.forEach(r=>setT('pp-'+t.id+'-'+r.p.id+'-'+x,'',false));
        const par=parOf(x),w=j%n,ch=scoreOf(t.id,'C',x)||'';
        const nets=info.rows.map((r,i)=>{const g=parseScore(scoreOf(t.id,r.p.id,x));return g==null?null:(g==='x'?99:g-str[i][j]);});
        if(!ch||nets.some(v=>v==null))return;
        let side=[w],mult=1,lone=false;
        if(ch==='L'||ch==='B'){lone=true;if(ch==='B')mult=Number(ws.blind)||1;}else{const pi=info.rows.findIndex(r=>r.p.id===ch);if(pi<0||pi===w)return;side=[w,pi];}
        const others=info.rows.map((r,i)=>i).filter(i=>!side.includes(i));

        if(a===b)return;

        else{(a<b?side:others).forEach(i=>give(i,Number(ws.win2)||0));}
      });
      info.rows.forEach((r,i)=>{setT('tp-'+t.id+'-'+r.p.id,pt[i]);const g=hs.map(x=>parseScore(scoreOf(t.id,r.p.id,x))).filter(v=>typeof v==='number');setT('g-'+t.id+'-'+r.p.id,g.length?sum(g):'');rank.push({n:r.p.name+' ('+t.name+')',pts:pt[i]});});

}

const Store={mode:'local',status:'loading',players:[],games:[],q:Promise.resolve(),
  lsRead(k){try{const v=JSON.parse(localStorage.getItem(LSK[k])||'[]');return Array.isArray(v)?v:[];}catch(e){return[];}},
  lsWrite(k){try{localStorage.setItem(LSK[k],JSON.stringify(this[k]));}catch(e){toast('Enregistrement impossible : le navigateur refuse le stockage local.');}},
  async init(){
    this.players=this.lsRead('players');this.games=this.lsRead('games');
    let db=null;
    try{if(window.claude&&window.claude.use)db=await window.claude.use('db');}catch(e){db=null;}
    if(!db){this.mode='local';this.status='ok';onStore();return;}
    this.mode='db';DBH=db;this.players=[];this.games=[];this.status='loading';onStore();
    const t=setTimeout(()=>{if(this.status==='loading'){this.status='slow';onStore();}},10000);
    const sub=k=>DBH.collection(k).onSnapshot(snap=>{this[k]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(!snap.metadata.fromCache){clearTimeout(t);this.status='ok';}onStore();},()=>{clearTimeout(t);this.status='error';onStore();});
    sub('players');sub('games');
  },
  put(k,doc){
    const body=clone(doc),id=body.id;delete body.id;
    const op=async()=>{
      if(this.mode==='db'){await DBH.collection(k).doc(id).set(body);}
      else{const a=this[k],i=a.findIndex(x=>x.id===id),full=Object.assign({id},body);if(i>=0)a[i]=full;else a.push(full);this.lsWrite(k);onStore();}
    };
    const pr=this.q.then(op).then(()=>true,e=>{toast('Enregistrement impossible'+(e&&e.code?' ('+e.code+')':'')+'.');return false;});
    this.q=pr;return pr;
  },
  del(k,id){
    const op=async()=>{
      if(this.mode==='db'){await DBH.collection(k).doc(id).delete();}
      else{this[k]=this[k].filter(x=>x.id!==id);this.lsWrite(k);onStore();}
    };
    const pr=this.q.then(op).then(()=>true,e=>{toast('Suppression impossible'+(e&&e.code?' ('+e.code+')':'')+'.');return false;});
    this.q=pr;return pr;
  }
};

    const block=(title,gl)=>{
      y+=30;ctx.fillStyle=INK;ctx.font='700 26px '+SAN;ctx.fillText(title,X,y);y+=14;
      const y0=y;
      if(m.hasNet){
        const nl=gl.slice().sort((a,b)=>a.dn-b.dn||a.net-b.net);
        ctx.fillStyle=MUT;ctx.font='700 20px '+SAN;try{ctx.letterSpacing='2px';}catch(e){}
        ctx.fillText('BRUT',X+4,y0+16);ctx.fillText('NET',X+colW+GAP+4,y0+16);try{ctx.letterSpacing='0px';}catch(e){}
        drawCol(gl,X,y0+26,false);drawCol(nl,X+colW+GAP,y0+26,true);
        y=y0+26+gl.length*66-8;
      }else{
        const half=Math.ceil(gl.length/2);
        drawCol(gl.slice(0,half),X,y0,false,0);drawCol(gl.slice(half),X+colW+GAP,y0,false,half);
        y=y0+half*66-8;
      }
    };
    if(m.grossT&&m.grossT.length)block('Équipes',m.grossT);
    if(m.gross&&m.gross.length)block(m.grossT&&m.grossT.length?'Joueurs':'Joueurs',m.gross);
    if(anyP){ctx.fillStyle=MUT;ctx.font='italic 400 20px '+SAN;ctx.fillText('* partie incomplète : écart calculé sur les trous joués',X,y+26);y+=34;}
  }
  // joueurs
  label('Joueurs');
  const hpJ=m.groups.some(g=>g.players.some(p=>isP(p.name)));
  m.groups.forEach(gr=>{
    if(m.mode==='teams'&&gr.players.length){ctx.fillStyle=INK;ctx.font='700 28px '+SAN;ctx.fillText(gr.name,X,y+22);y+=40;}
    gr.players.forEach(p=>{
      const jx=X+(m.mode==='teams'?18:0);if(hpJ)avatar(p.name,jx+15,y+14,15);ctx.fillStyle=INK;ctx.font='500 28px '+SAN;let nm=p.name;while(ctx.measureText(nm).width>CW-360-(hpJ?40:0)&&nm.length>3)nm=nm.slice(0,-2);ctx.fillText(nm,jx+(hpJ?40:0),y+22);
      ctx.textAlign='right';ctx.fillStyle=MUT;ctx.font='400 25px '+SAN;ctx.fillText('Départ '+p.tee.toLowerCase()+(m.strokes&&p.hcp!==''?' · HCP '+p.hcp:''),X+CW,y+22);ctx.textAlign='left';
      y+=40;
    });
    y+=6;
  });
  // cartes de score
  if(m.hasScores&&m.cards&&m.cards.length){
    label('Cartes de score');
    const ST={e:['#f6c945','#3b2a00','#b98a00'],b:['#cde8bd','#1d4a10','#5d9b3f'],o:['#fbd9c4','#7a2f0c','#d98a5f'],d:['#f0a78f','#561203','#b4481f']};
    const NW=190,TW=100,cw=(CW-NW-TW)/9;
    const cell=(cx,cy,gv,par)=>{
      if(gv==null)return;
      if(gv==='x'){ctx.strokeStyle=MUT;ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-8,cy-8);ctx.lineTo(cx+8,cy+8);ctx.moveTo(cx+8,cy-8);ctx.lineTo(cx-8,cy+8);ctx.stroke();ctx.lineCap='butt';return;}
      const d=gv-par,k=(gv===1||d<=-2)?'e':d===-1?'b':d===1?'o':d>=2?'d':'';
      if(k){const c=ST[k];ctx.lineWidth=2.5;ctx.fillStyle=c[0];ctx.strokeStyle=c[2];
        if(k==='e'||k==='b'){ctx.beginPath();ctx.arc(cx,cy,20,0,7);ctx.fill();ctx.stroke();if(k==='e'){ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,25,0,7);ctx.stroke();}}
        else{rr(cx-19,cy-19,38,38,5);ctx.fill();ctx.stroke();if(k==='d'){ctx.lineWidth=2;rr(cx-24,cy-24,48,48,7);ctx.stroke();}}
        ctx.fillStyle=c[1];ctx.font='700 24px '+SAN;
      }else{ctx.fillStyle=INK;ctx.font='500 24px '+SAN;}
      ctx.textAlign='center';ctx.fillText(String(gv),cx,cy+8);ctx.textAlign='left';
    };
    m.cards.forEach(cd=>{
      if(m.mode==='teams'){ctx.fillStyle=INK;ctx.font='700 28px '+SAN;ctx.fillText(cd.name,X,y+28);y+=44;}
      for(let s0=0;s0<m.holes.length;s0+=9){
        const seg=m.holes.slice(s0,s0+9);
        ctx.fillStyle='#e9e1cc';rr(X,y,CW,44,8);ctx.fill();
        ctx.fillStyle=MUT;ctx.font='600 22px '+SAN;ctx.fillText('Trou',X+14,y+30);ctx.textAlign='center';
        seg.forEach((h,i)=>ctx.fillText(String(h.n),X+NW+cw*i+cw/2,y+30));ctx.fillText('Tot',X+CW-TW/2,y+30);ctx.textAlign='left';y+=44;
        ctx.fillStyle=MUT;ctx.font='400 22px '+SAN;ctx.fillText('Par',X+14,y+30);ctx.textAlign='center';
        seg.forEach((h,i)=>ctx.fillText(String(h.par),X+NW+cw*i+cw/2,y+30));ctx.fillText(String(seg.reduce((a,h)=>a+h.par,0)),X+CW-TW/2,y+30);ctx.textAlign='left';
        ctx.strokeStyle='#d9d0b8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X,y+44);ctx.lineTo(X+CW,y+44);ctx.stroke();y+=44;
        cd.rows.forEach(r=>{
          const cy=y+30;ctx.fillStyle=INK;ctx.font='600 24px '+SAN;let nm=r.n;while(ctx.measureText(nm).width>NW-16&&nm.length>3)nm=nm.slice(0,-2);if(nm!==r.n)nm+='…';ctx.fillText(nm,X+14,cy+8);
          let tot=0,any=false;
          seg.forEach((h,i)=>{const gv=r.v[s0+i];cell(X+NW+cw*i+cw/2,cy,gv,h.par);const e=r.eff?r.eff[s0+i]:(typeof gv==='number'?gv:null);if(typeof e==='number'){tot+=e;any=true;}});
          ctx.fillStyle=HOT;ctx.font='700 26px '+SAN;ctx.textAlign='center';if(any)ctx.fillText(String(tot),X+CW-TW/2,cy+8);ctx.textAlign='left';
          ctx.strokeStyle='#e6dec9';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(X,y+60);ctx.lineTo(X+CW,y+60);ctx.stroke();
          y+=60;
        });
        y+=22;
      }
      y+=4;
    });
    y-=10;
  }
  // commentaire
  if(m.comment){
    label('Commentaire');
    ctx.fillStyle=INK;ctx.font='italic 400 28px '+SAN;
    let L=wrapT(ctx,m.comment,CW);if(L.length>9){L=L.slice(0,9);L[8]=L[8].replace(/.{0,2}$/,'')+'…';}
    L.forEach(l=>{ctx.fillText(l,X,y+26);y+=38;});
  }
  // pied
  y+=46;const fy=y;
  ctx.fillStyle='#e8702a';ctx.fillRect(0,fy,W,8);ctx.fillStyle='#3f6f2c';ctx.fillRect(0,fy+8,W,112);
  ctx.fillStyle='#fbf6ea';ctx.textAlign='center';ctx.font='700 34px '+SER;ctx.fillText('The Gentlemen’s Golf Club',W/2,fy+78);ctx.textAlign='left';
  return fy+120;
}
async function renderShare(m){
  try{await Promise.all([document.fonts.load('700 56px "Playfair Display"'),document.fonts.load('600 30px Inter'),document.fonts.load('400 27px Inter')]);}catch(e){}
  try{await Promise.all(Object.values(m.ph||{}).filter(u=>!PHIMG[u]).map(u=>new Promise(r=>{const i=new Image();i.onload=()=>{PHIMG[u]=i;r();};i.onerror=r;i.src=u;})));}catch(e){}
  const c0=document.createElement('canvas');c0.width=1080;c0.height=7000;
  const H=Math.ceil(drawShare(c0.getContext('2d'),m));
  const c=document.createElement('canvas');c.width=1080;c.height=H;drawShare(c.getContext('2d'),m);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
}
let SH=null;
const shFile=()=>'tournette-'+((SH&&SH.m.date)||todayStr())+'.png';
function closeShare(){const b=$('shm');if(b)b.hidden=true;if(SH&&SH.url)try{URL.revokeObjectURL(SH.url);}catch(e){}SH=null;}
async function openShare(m){
  const box=$('shm');if(SH&&SH.url)try{URL.revokeObjectURL(SH.url);}catch(e){}
  SH={m,text:shareText(m),blob:null,url:''};const mine=SH;
  const head='<div class="shh"><b>Partager le résultat</b><button class="btn" data-act="sh-close" aria-label="Fermer">×</button></div>';
  box.hidden=false;box.innerHTML='<div class="shbox" role="dialog" aria-modal="true" aria-label="Partager le résultat">'+head+'<p class="ok" style="margin:0">Préparation du visuel…</p></div>';
  try{mine.blob=await renderShare(m);mine.url=URL.createObjectURL(mine.blob);}catch(e){mine.blob=null;}
  if(SH!==mine)return;
  const sub=encodeURIComponent('Tournette — '+(m.title||'résultat de la partie')+' ('+m.date+')'),body=encodeURIComponent(mine.text);
  box.innerHTML='<div class="shbox" role="dialog" aria-modal="true" aria-label="Partager le résultat">'+head+
   (mine.url?'<img class="shimg" src="'+mine.url+'" alt="Visuel du résultat de la partie">':'<p class="note">Le visuel n’a pas pu être généré. Le texte reste disponible.</p>')+
   (mine.m.indiv&&mine.m.indiv.length?'<label class="ok" style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" data-shi="1"'+(mine.m.showIndiv?' checked':'')+'> Inclure le classement individuel</label>':'')+((mine.m.gross&&mine.m.gross.length)||(mine.m.grossT&&mine.m.grossT.length)?'<label class="ok" style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" data-shg="1"'+(mine.m.showGross?' checked':'')+'> Inclure le classement brut'+(mine.m.hasNet?' et net':'')+' (équipes et joueurs, en 2 colonnes)</label>':'')+'<div class="row"><button class="btn pri" data-act="sh-native">Partager…</button>'+(mine.url?'<button class="btn" data-act="sh-save">Enregistrer l’image</button>':'')+
   '<a class="btn" href="https://wa.me/?text='+body+'" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="mailto:?subject='+sub+'&body='+body+'">E-mail</a><button class="btn" data-act="sh-copy">Copier le texte</button></div>'+
   '<textarea id="sh-text" rows="6" readonly aria-label="Texte du résultat">'+esc(mine.text)+'</textarea>'+
   '<p class="ok" style="margin:0">« Partager… » envoie l’image directement vers vos applications (messagerie, réseaux sociaux, e-mail) depuis l’application installée. Sinon, enregistrez l’image (ou appuyez longuement dessus) puis joignez-la ; WhatsApp et e-mail transmettent le texte, pas l’image.</p></div>';
}
async function shNative(){
  if(!SH)return;const data={title:SH.m.title||'Résultat de la partie',text:SH.text};
  try{
    if(SH.blob){const f=new File([SH.blob],shFile(),{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))data.files=[f];}
    if(!navigator.share)throw new Error('ns');
    await navigator.share(data);
  }catch(e){if(e&&e.name==='AbortError')return;toast('Partage direct indisponible ici : enregistrez l’image ou copiez le texte.');}
}
async function shSave(){
  if(!SH||!SH.blob)return;const name=shFile();let d=null;
  try{if(window.claude&&window.claude.use)d=await window.claude.use('downloads');}catch(e){d=null;}
  if(d){try{await d.save({filename:name,data:SH.blob});toast('Image enregistrée.');}catch(e){if(!e||e.code!=='declined')toast('Enregistrement impossible.');}return;}
  const a=document.createElement('a');a.href=SH.url;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Image téléchargée.');
}
async function shCopy(){
  if(!SH)return;
  try{await navigator.clipboard.writeText(SH.text);toast('Texte copié.');}
  catch(e){const t=$('sh-text');if(t){t.select();let ok=false;try{ok=document.execCommand('copy');}catch(x){}toast(ok?'Texte copié.':'Sélectionnez le texte pour le copier.');}}
}
document.addEventListener('change',e=>{const el=e.target;if(el&&el.dataset&&(el.dataset.shi||el.dataset.shg)&&SH){const m=SH.m;if(el.dataset.shi)m.showIndiv=el.checked;else m.showGross=el.checked;openShare(m);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const b=$('shm');if(b&&!b.hidden)closeShare();}});

/* ---- événements ---- */
const app=document.getElementById('app');
const findT=id=>[S.flight].concat(S.teams).find(t=>t.id===id);
app.addEventListener('click',e=>{
  if(e.target.id==='shm'){closeShare();return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.v,tEl=b.closest('[data-t]'),t=tEl&&findT(tEl.dataset.t);
  if(handleStoreAct(act,b))return;
  if(act==='mode'){S.mode=v;rMode();rPlayers();rDerived();}
  else if(act==='course'){S.course=v;rCourse();rPlayers();rRoster();rDerived();}
  else if(act==='loop'){S.loop=v;rCourse();rPlayers();rRoster();rDerived();}
  else if(act==='strokes'){S.strokes=v==='1';rCourse();rDerived();}
  else if(act==='format'){S.format=v;rFormat();rPlayers();rDerived();}
  else if(act==='addt'){S.teams.push({id:uid(),name:'Équipe '+String.fromCharCode(65+S.teams.length%26),players:[mkPlayer('Nouveau joueur','M','W','')]});rPlayers();rDerived();focusNewName();}
  else if(act==='delt'&&t){S.teams=S.teams.filter(x=>x!==t);rPlayers();rDerived();}
  else if(act==='addp'&&t){if(S.mode==='flight'&&t.players.length>=4)return;t.players.push(mkPlayer('Nouveau joueur','M','Y',''));rPlayers();rDerived();focusNewName();}
  else if(act==='delp'&&t){const pid=b.closest('[data-p]').dataset.p;t.players=t.players.filter(p=>p.id!==pid);rPlayers();rDerived();}
  else if(act==='sc-clear'){SC_CONF=true;rCard();updateScores();}
  else if(act==='sc-cancel'){SC_CONF=false;rCard();updateScores();}
  else if(act==='sc-clearc'){SC_CONF=false;S.scores={};rCard();updateScores();save();toast('Scores effacés.');}
  else if(act==='ex'){if(S.mode==='flight')S.flight=exFlight();else S.teams=example();S.scores={};rPlayers();rDerived();}
  else if(act==='clear'){if(S.mode==='flight')S.flight.players=[];else S.teams=[];S.scores={};rPlayers();rDerived();}
});
app.addEventListener('change',e=>{
  const el=e.target;
  if(handleStoreChange(el))return;
  if(el.dataset.course){S.course=el.value;if(!hasLoops(S.course))S.loop='18';pushRecent(S.course);const n=fitTees();rCourse();rPlayers();rRoster();rDerived();if(n)toast(n+' départ'+(n>1?'s':'')+' ajusté'+(n>1?'s':'')+' : ce parcours n’a pas les mêmes départs.');return;}
  if(el.dataset.f){
    const row=el.closest('[data-t]'),t=findT(row.dataset.t);if(!t)return;
    if(el.dataset.f==='tname'){t.name=el.value;rDerived();return;}
    const p=t.players.find(x=>x.id===el.closest('[data-p]').dataset.p);if(!p)return;
    p[el.dataset.f]=el.value;
    updCH(p);rDerived();
  }else if(el.dataset.c){
    const cfg=S.cfg[S.format],k=el.dataset.c,raw=el.value.trim(),num=['pct','nb','nw','drives','win2','lone','loseEach','blind'];
    cfg[k]=num.includes(k)?(isNaN(Number(raw))||raw===''?cfg[k]:Number(raw)):raw;
    rFormat();rDerived();
  }else if(el.dataset.hp){
    const H=HO(S.course),v=parseInt(el.value,10);if(v>0)H[el.dataset.hp][+el.dataset.h]=v;rDerived();
  }
});
app.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.s&&el.tagName==='INPUT'){if(el.value.length>1)el.value=el.value.replace(/[✕×]/g,'');if(parseScore(el.value)==='x'&&el.value!=='✕')el.value='✕';S.scores[el.dataset.s]=el.value;
    document.querySelectorAll('.cnt').forEach(c=>c.classList.remove('cnt'));updateScores();save();}
});
app.addEventListener('change',e=>{const el=e.target;if(el.dataset.s&&el.tagName==='SELECT'){S.scores[el.dataset.s]=el.value;document.querySelectorAll('.cnt').forEach(c=>c.classList.remove('cnt'));updateScores();save();}});
document.addEventListener('click',e=>{const h=e.target.closest&&e.target.closest('section>h2');if(!h)return;const sec=h.parentElement;sec.classList.toggle('min');h.setAttribute('aria-expanded',String(!sec.classList.contains('min')));});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('section>h2')){e.preventDefault();e.target.click();}});
function decorate(){applyRO();document.querySelectorAll('#app section>h2').forEach(h=>{h.setAttribute('role','button');h.tabIndex=0;h.setAttribute('aria-expanded',String(!h.parentElement.classList.contains('min')));});}
new MutationObserver(decorate).observe(document.getElementById('app'),{childList:true,subtree:true});
renderAll();decorate();
Store.init();
</script>
